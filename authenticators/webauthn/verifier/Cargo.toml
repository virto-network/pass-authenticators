[package]
authors.workspace = true
description = "no_std verifier for WebAuthn ES256 (P-256) assertion signatures, used by pass-authenticators-webauthn."
edition.workspace = true
keywords = ["webauthn", "passkey", "p256", "signature", "no-std"]
categories = ["authentication", "cryptography", "no-std"]
license.workspace = true
name = "pass-authenticators-webauthn-verifier"
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
log.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
sha2.workspace = true

[dev-dependencies]
coset.workspace = true
passkey-authenticator.workspace = true
rand.workspace = true

[features]
default = ["std"]
std = ["coset/std", "log/std", "p256/std", "rand/std", "sha2/std"]
