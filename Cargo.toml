[workspace.package]
authors = ["Virto Team <contact@virto.network>"]
edition = "2021"
license = "GPL-3.0-only"
version = "2.0.0-pre.1"
repository = "https://github.com/virto-network/pass-authenticators"
readme = "README.md"

[workspace.dependencies]
# WebAuthn
base64 = { package = "simple-base64", version = "0.23.2", default-features = false }
coset = { version = "0.3.8", default-features = false }
futures = { version = "0.3.31", default-features = false, features = [
  "executor",
] }
log = { version = "0.4.27", default-features = false }
p256 = { version = "0.13.2", default-features = false }
passkey-authenticator = { version = "0.4.0", default-features = false, features = [
  "testable",
] }
passkey-client = { version = "0.4.0", default-features = false, features = [
  "testable",
] }
passkey-types = { version = "0.4.0", default-features = false, features = [
  "testable",
] }
public-suffix = "0.1.2"
rand = "0.8.5"
rand_core = { version = "0.6.4", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
url = { version = "2.5.8", default-features = false }
webauthn-verifier = { package = "pass-authenticators-webauthn-verifier", path = "authenticators/webauthn/verifier", version = "2.0.0-pre.1", default-features = false }
byteorder = { version = "1.5.0", default-features = false }
bitflags = { version = "2.9.1", default-features = false }

# Codecs
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = [
  "derive",
] }
scale-info = { version = "2.11.6", default-features = false, features = [
  "derive",
] }
serde = { version = "1.0.219", default-features = false }
serde_json = { version = "1.0.141", default-features = false }

# Crypto
ed25519-zebra = { version = "4.1.0", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["schnorr", "alloc", "pkcs8"] }
ripemd = { version = "0.1.3", default-features = false }
schnorrkel = { version = "0.11.5", default-features = false }

# Substrate
sp-core = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }

# FRAME
frame = { version = "0.18.0", package = "polkadot-sdk-frame", default-features = false }
frame-support = { version = "48.1.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
pallet-scheduler = { version = "50.0.0", default-features = false }

# FRAME Contrib
#
# TODO: switch both to crates.io once frame-contrib publishes the 3.x release that includes
# virto-network/frame-contrib#86, #87 and #91. Until then, they point at #91's branch
# (`feat/authenticator-benchmark-helpers`, stacked on #87), pinned by `rev`, for the
# `verification_weight` hooks on `DeviceChallengeResponse`/`UserChallengeResponse` and the
# `runtime-benchmarks` helper traits (`DeviceAttestationBenchmarkHelper`,
# `CredentialBenchmarkHelper`).
traits-authn = { git = "https://github.com/virto-network/frame-contrib", rev = "645861905c2a2691b1f0fdbfcd2a6c8a4ff53f03", package = "fc-traits-authn", default-features = false }
pallet-pass = { git = "https://github.com/virto-network/frame-contrib", rev = "645861905c2a2691b1f0fdbfcd2a6c8a4ff53f03", package = "fc-pallet-pass", default-features = false }

[workspace]
members = ["authenticators/*", "integration-tests"]
resolver = "2"
